name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Load the private codec digest list (maintainers' secret; skipped when absent)
        shell: bash
        env:
          CODEC_DIGESTS: ${{ secrets.OPENXL330_CODEC_DIGESTS }}
        run: |
          if [ -n "$CODEC_DIGESTS" ]; then
            printf '%s\n' "$CODEC_DIGESTS" > "$RUNNER_TEMP/codec-digests.txt"
            echo "OPENXL330_CODEC_DIGESTS=$RUNNER_TEMP/codec-digests.txt" >> "$GITHUB_ENV"
          fi
      - name: Run tests
        run: python -m pytest -q

  build:
    name: Build and smoke-test distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install build tools
        run: python -m pip install build "hatchling>=1.27"
      - name: Build source distribution and wheel
        run: python -m build --no-isolation
      - name: Smoke-test the installed wheel
        run: |
          wheel_env="$RUNNER_TEMP/openxl330-wheel"
          python -m venv "$wheel_env"
          "$wheel_env/bin/python" -m pip install dist/*.whl
          "$wheel_env/bin/python" -m pip check
          "$wheel_env/bin/openxl330" version
          "$wheel_env/bin/openxl330" scan --sim 3
          "$wheel_env/bin/python" -m openxl330.selftest --sim 3 --ids 1,2,3 --roundtrip-id 2 --out "$RUNNER_TEMP/openxl330-selftest"
